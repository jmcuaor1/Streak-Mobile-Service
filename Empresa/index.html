<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añadir un empleo</title>
  <link rel="stylesheet" href="Style.css">
  <script src="https://kit.fontawesome.com/a2e0d6b22f.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="container">
    <header>
      <h2>Añadir un empleo</h2>
      <!-- Barra de Progreso -->
      <div class="progressbar">
        <div class="progress" id="progress"></div>
        <div class="progress-step progress-step-active" data-title="Detalles"></div>
        <div class="progress-step" data-title="Empresa"></div>
        <div class="progress-step" data-title="Descripción"></div>
      </div>
    </header>

    <form id="job-form" class="form">
      <!-- Paso 1: Detalles del Puesto -->
      <div class="form-step form-step-active">
        <div class="input-group">
          <label for="puesto">Puesto de trabajo*</label>
          <div class="input-icon-wrapper">
            <i class="fas fa-briefcase input-icon"></i>
            <input type="text" id="puesto" placeholder="Ej: Ingeniero de Software" required>
          </div>
        </div>
        <div class="input-group">
          <label for="tipoLugar">Tipo de lugar de trabajo</label>
          <div class="input-icon-wrapper">
            <i class="fas fa-map-marker-alt input-icon"></i>
            <input type="text" id="tipoLugar" placeholder="Ej: En la sede, Remoto, Híbrido">
          </div>
        </div>
        <div class="btns-group">
          <a href="#" class="btn btn-next">Siguiente</a>
        </div>
      </div>

      <!-- Paso 2: Sobre la Empresa -->
      <div class="form-step">
        <div class="input-group">
          <label for="empresa">Empresa</label>
          <div class="input-icon-wrapper">
            <i class="far fa-building input-icon"></i>
            <input type="text" id="empresa" placeholder="Ej: Apple Inc.">
          </div>
        </div>
        <div class="input-group">
          <label for="tipoEmpleo">Tipo de empleo</label>
          <div class="input-icon-wrapper">
            <i class="far fa-clock input-icon"></i>
            <input type="text" id="tipoEmpleo" placeholder="Ej: Tiempo completo, Medio tiempo">
          </div>
        </div>
        <div class="btns-group">
          <a href="#" class="btn btn-prev">Atrás</a>
          <a href="#" class="btn btn-next">Siguiente</a>
        </div>
      </div>

      <!-- Paso 3: Descripción -->
      <div class="form-step">
        <div class="input-group">
          <label for="descripcion">Descripción del empleo</label>
          <textarea id="descripcion" rows="5" placeholder="Describe las responsabilidades, requisitos y beneficios..."></textarea>
        </div>
        <div class="btns-group">
          <a href="#" class="btn btn-prev">Atrás</a>
          <input type="submit" value="Publicar empleo" class="btn">
        </div>
      </div>
    </form>
  </main>

  <script src="Script.js"></script>
</body>
</html>
