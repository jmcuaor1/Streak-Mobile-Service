name: streak
description: "Streak - Plataforma gamificada de empleos y freelancing"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI - Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # State Management
  flutter_riverpod: ^3.0.3

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0-beta.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^16.2.4

  # Real-time
  socket_io_client: ^3.1.2

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_svg: ^2.0.9

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Utils
  timeago: ^3.6.1
  logger: ^2.0.2
  equatable: ^2.0.5

  # Code generation
  freezed_annotation: ^2.4.1

  # Firebase
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3

  # Permissions
  permission_handler: ^12.0.1

  # File handling
  file_picker: ^10.3.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Descomentar cuando agreguemos assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/lottie/

  # Descomentar cuando agreguemos fuentes personalizadas
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
