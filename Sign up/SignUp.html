<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear una cuenta</title>
  <link rel="stylesheet" href="StyleS.css">
  <script src="https://kit.fontawesome.com/a2e0d6b22f.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="signup-card">
    <header>
      <h1>Crear una cuenta</h1>
      <p class="subtitle">
        Únete a nuestra comunidad. ¡Es rápido y fácil!
      </p>
    </header>

    <form id="signup-form" class="signup-form">
      <div class="input-icon-wrapper">
        <i class="fas fa-user input-icon"></i>
        <label for="name" class="sr-only">Nombre completo</label>
        <input type="text" id="name" placeholder="Nombre completo" required>
      </div>

      <div class="input-icon-wrapper">
        <i class="fas fa-envelope input-icon"></i>
        <label for="email" class="sr-only">Email</label>
        <input type="email" id="email" placeholder="Correo electrónico" required>
      </div>

      <div class="input-icon-wrapper">
        <i class="fas fa-lock input-icon"></i>
        <label for="password" class="sr-only">Contraseña</label>
        <input type="password" id="password" placeholder="**********" required>
        <i id="togglePassword" class="fas fa-eye toggle-icon"></i>
      </div>

      <div id="password-strength-meter" class="password-strength-meter">
        <div id="password-strength-bar" class="strength-bar"></div>
        <span id="password-strength-text" class="strength-text"></span>
      </div>

      <button type="submit" class="btn-primary">REGÍSTRATE</button>

      <button type="button" class="btn-google">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google icon">
        REGÍSTRATE CON GOOGLE
      </button>
    </form>

    <p class="login-link">
      ¿Ya tienes una cuenta? <a href="#">Inicia sesión</a>
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
