<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido</title>
  <link rel="stylesheet" href="Style.css">
  <script src="https://kit.fontawesome.com/a2e0d6b22f.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="onboarding-container">
    <main class="onboarding-card">
      <header>
        <img 
          src="https://cdn-icons-png.flaticon.com/512/3135/3135679.png" 
          alt="Búsqueda de empleo" 
          class="onboarding-illustration"
        >
        <h1>Encuentra tu próximo reto profesional</h1>
        <p>
          Explora miles de oportunidades y conecta con las mejores empresas. Tu futuro trabajo te está esperando.
        </p>
      </header>

      <footer>
        <button id="nextBtn" class="next-btn" title="Siguiente">
          <span class="arrow">→</span>
          <span class="checkmark">✔</span>
        </button>
      </footer>
    </main>
  </div>
  <script src="structure.js"></script>
</body>
</html>
